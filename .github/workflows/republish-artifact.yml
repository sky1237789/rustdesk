name: Republish Artifact as Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source run id to fetch artifact from'
        required: true
      artifact_name:
        description: 'Artifact name'
        required: true
        default: 'rustdesk-sos-macos-arm64'

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./out

      - name: List downloaded files
        run: ls -la ./out

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: republish-${{ github.run_id }}
          name: Republished artifact ${{ github.event.inputs.artifact_name }}
          prerelease: true
          files: ./out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
